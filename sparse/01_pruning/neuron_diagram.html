<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer FFN 神经元示意图</title>
<style>
  body {
    margin: 0; padding: 32px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e6e6e6;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: #9aa0a6; font-size: 13px; margin-top: 0; margin-bottom: 24px; }
  .legend { display: flex; gap: 24px; font-size: 13px; margin-top: 20px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .caption { fill: #9aa0a6; font-size: 13px; }
  .title { fill: #e6e6e6; font-size: 14px; font-weight: 600; }
  .weight { fill: #6b7280; font-size: 11px; }
</style>
</head>
<body>
  <h1>Transformer FFN 中的一个「神经元」</h1>
  <p class="sub">输入线 = fc1 第 i 行（一组权重）· 输出线 = fc2 第 i 列（一组权重）· 本体只输出 1 个标量</p>

  <svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
    <!-- ===== 上层输入 x (d_model 个信号) ===== -->
    <text class="title" x="60" y="40">上一层输出  x</text>
    <g>
      <circle cx="90"  cy="120" r="14" fill="#3b82f6"/>
      <circle cx="90"  cy="190" r="14" fill="#3b82f6"/>
      <circle cx="90"  cy="260" r="14" fill="#3b82f6"/>
      <circle cx="90"  cy="330" r="14" fill="#3b82f6"/>
      <circle cx="90"  cy="400" r="14" fill="#3b82f6"/>
      <text class="caption" x="60" y="125">x₁</text>
      <text class="caption" x="60" y="195">x₂</text>
      <text class="caption" x="60" y="265">x₃</text>
      <text class="caption" x="60" y="335">x₄</text>
      <text class="caption" x="60" y="405">x₅</text>
      <text class="caption" x="48" y="445" font-style="italic">… (共 d_model 个)</text>
    </g>

    <!-- ===== fc1 输入线 (第 i 行权重 wᵢⱼ) ===== -->
    <text class="title" x="300" y="40">fc1 第 i 行（输入线 wᵢⱼ）</text>
    <g stroke="#22c55e" stroke-width="2" opacity="0.8">
      <line x1="104" y1="120" x2="430" y2="250"/>
      <line x1="104" y1="190" x2="430" y2="250"/>
      <line x1="104" y1="260" x2="430" y2="250"/>
      <line x1="104" y1="330" x2="430" y2="250"/>
      <line x1="104" y1="400" x2="430" y2="250"/>
    </g>
    <text class="weight" x="230" y="180">Σ wᵢⱼ · xⱼ</text>

    <!-- ===== 神经元本体 ===== -->
    <rect x="400" y="200" width="90" height="100" rx="14" fill="#1f2937" stroke="#f59e0b" stroke-width="2.5"/>
    <text class="title" x="415" y="240" font-size="12">加权求和</text>
    <text class="title" x="415" y="262" font-size="12">↓ 激活 σ</text>
    <text class="title" x="428" y="292" font-size="12">aᵢ</text>
    <text class="caption" x="410" y="325">神经元 i 本体</text>

    <!-- 标量输出标记 -->
    <circle cx="490" cy="250" r="9" fill="#f59e0b"/>
    <text class="caption" x="505" y="254">★ 一个标量 aᵢ</text>

    <!-- ===== fc2 输出线 (第 i 列权重 vₖᵢ) ===== -->
    <text class="title" x="600" y="40">fc2 第 i 列（输出线 vₖᵢ）</text>
    <g stroke="#ef4444" stroke-width="2" opacity="0.8">
      <line x1="499" y1="250" x2="800" y2="120"/>
      <line x1="499" y1="250" x2="800" y2="190"/>
      <line x1="499" y1="250" x2="800" y2="260"/>
      <line x1="499" y1="250" x2="800" y2="330"/>
      <line x1="499" y1="250" x2="800" y2="400"/>
    </g>
    <text class="weight" x="640" y="180">aᵢ · vₖᵢ</text>

    <!-- ===== 下一层输出 y ===== -->
    <text class="title" x="820" y="40">下一层 y</text>
    <g>
      <circle cx="845" cy="120" r="14" fill="#a855f7"/>
      <circle cx="845" cy="190" r="14" fill="#a855f7"/>
      <circle cx="845" cy="260" r="14" fill="#a855f7"/>
      <circle cx="845" cy="330" r="14" fill="#a855f7"/>
      <circle cx="845" cy="400" r="14" fill="#a855f7"/>
      <text class="caption" x="855" y="125">y₁</text>
      <text class="caption" x="855" y="195">y₂</text>
      <text class="caption" x="855" y="265">y₃</text>
      <text class="caption" x="855" y="335">y₄</text>
      <text class="caption" x="855" y="405">y₅</text>
      <text class="caption" x="828" y="445" font-style="italic">… (共 d_model 个)</text>
    </g>

    <!-- ===== 公式框 ===== -->
    <rect x="400" y="420" width="450" height="70" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text class="caption" x="415" y="448">aᵢ = σ( Σⱼ wᵢⱼ · xⱼ )          ← 每个 token 每个神经元只输出 1 个数</text>
    <text class="caption" x="415" y="472">yₖ = Σᵢ aᵢ · vₖᵢ              ← 神经元 i 的 aᵢ 经 fc2 第 i 列广播到所有 yₖ</text>
  </svg>

  <div class="legend">
    <span><i class="dot" style="background:#3b82f6"></i> 上层输入信号 xⱼ</span>
    <span><i class="dot" style="background:#22c55e"></i> fc1 输入线（第 i 行权重）</span>
    <span><i class="dot" style="background:#f59e0b"></i> 神经元本体 + 标量输出 aᵢ</span>
    <span><i class="dot" style="background:#ef4444"></i> fc2 输出线（第 i 列权重）</span>
    <span><i class="dot" style="background:#a855f7"></i> 下层输出 yₖ</span>
  </div>
</body>
</html>
